name: C++ CodeQL

on:
  push:
    branches: [ "main", "ci/**", "feat/**", "test/**", "fix/**" ]
    paths: ["src/**", "cmake/**", "CMakeLists.txt", ".github/workflows/codeql.yml"]
  pull_request:
    branches: [ "main" ]
    paths: ["src/**", "cmake/**", "CMakeLists.txt", ".github/workflows/codeql.yml"]
  schedule:
    - cron: '16 3 * * 4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.5.*"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: c-cpp
          build-mode: manual
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Qt
      if: matrix.language == 'c-cpp'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        cache: true

    - name: Install dependencies (Linux C/C++)
      if: matrix.language == 'c-cpp'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Run manual build steps (C/C++)
      if: matrix.language == 'c-cpp' && matrix.build-mode == 'manual'
      shell: bash
      env:
        CC: clang
        CXX: clang++
      run: |
        cmake -B build-codeql -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DQVIS_TOOLS_WARNINGS=OFF \
          -DQVIS_TOOLS_WARNINGS_AS_ERRORS=OFF

        cmake --build build-codeql --parallel

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
