name: Build and Test

on:
  push:
    branches: [ "main", "ci/**", "feat/**", "test/**", "fix/**" ]
    paths-ignore: [ "**.md" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "**.md" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: "6.5.*"

jobs:
  build:
    name: Build and test (${{ matrix.os }}, ${{ matrix.toolchain }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: gcc
          - os: ubuntu-24.04
            toolchain: clang

          - os: windows-2022
            toolchain: msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ${{ runner.os }}-${{ matrix.toolchain }}-fetchcontent-${{ hashFiles('cmake/QVisToolsDependencies.cmake') }}

      # Linux deps
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install GCC (Linux)
        if: runner.os == 'Linux' && matrix.toolchain == 'gcc'
        run: |
          sudo apt-get install -y g++

      - name: Install Clang (Linux)
        if: runner.os == 'Linux' && matrix.toolchain == 'clang'
        run: |
          sudo apt-get install -y clang

      # Linux (GCC/Clang)
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.toolchain }}
          CXX: ${{ matrix.toolchain == 'gcc' && 'g++' || 'clang++' }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQVIS_TOOLS_WARNINGS=ON \
            -DQVIS_TOOLS_WARNINGS_AS_ERRORS=ON \
            -DQVIS_TOOLS_BUILD_TESTS=ON

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --parallel

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure --parallel 4

      # Windows MSVC
      - name: Configure (Windows MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -B build
          -G "Visual Studio 17 2022" -A x64
          -DQVIS_TOOLS_WARNINGS=ON
          -DQVIS_TOOLS_WARNINGS_AS_ERRORS=ON
          -DQVIS_TOOLS_BUILD_TESTS=ON

      - name: Build (Windows MSVC)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Test (Windows MSVC)
        if: runner.os == 'Windows'
        run: ctest --test-dir build --build-config Release --output-on-failure --parallel 4
